name: ci

# Continuous integration for jankurai-paper.
# Thin workflow: every job delegates to ops/ci/<lane>.sh so local runs and CI
# execute the exact same commands (see scripts/ci-local.sh). Two lanes:
# a deterministic fast lane that builds the paper PDF, and a jankurai audit
# lane that publishes repo-score artifacts.
# Every third-party action is pinned to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache TeX Live and latexmk build state
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.texlive
            paper/jankurai.fdb_latexmk
            paper/jankurai.fls
          key: texlive-${{ runner.os }}-${{ hashFiles('paper/**/*.tex', 'paper/**/*.bib', '.latexmkrc') }}
          restore-keys: |
            texlive-${{ runner.os }}-
      - name: Install TeX Live
        uses: zauguin/install-texlive@0e4f50b945fb1e60af23f4790f0f7c3d8d7a0581 # v4
        with:
          packages: latexmk biber
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh

  security:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Secret scan, workflow lint, and SBOM
        run: bash ops/ci/security.sh
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.1
        with:
          sarif_file: target/jankurai/security/gitleaks.sarif
      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence
          path: |
            target/jankurai/security/evidence.json
            target/jankurai/security/gitleaks.sarif
            target/jankurai/security/zizmor.sarif
            target/jankurai/security/sbom.cyclonedx.json

  audit:
    name: jankurai-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run jankurai audit lane
        run: bash ops/ci/audit.sh
      - name: Upload repo-score artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-score
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md

  tool-adoption:
    name: tool-adoption-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run adopted jankurai tool lanes
        run: bash ops/ci/tool-adoption.sh
      - name: Upload tool-adoption evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tool-adoption-evidence
          path: |
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/vibe-coverage.json
            target/jankurai/vibe-coverage.md
            target/jankurai/security/evidence.json
