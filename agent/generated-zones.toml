# Generated zones for jankurai-paper.
# The only generated output tree in this LaTeX paper repo is target/, which
# holds jankurai audit output (and any latexmk build artifacts routed there).
# It is never hand-edited and is regenerated by the build/audit commands.

[[zone]]
path = "target/"
source = "jankurai audit and latexmk build output"
command = "jankurai audit . --no-score-history --json .jankurai/repo-score.json --md .jankurai/repo-score.md"
read_only = true
write_policy = "generated_output"

# Generated vibe-coverage TeX table, derived from the committed corpus.
[[zone]]
path = "paper/tex/generated/vibe_coverage_table.tex"
source = "agent/vibe-coverage.toml and tips/vibe_coding"
command = "jankurai vibe coverage --source agent/vibe-coverage.toml --tips tips/vibe_coding --tex paper/tex/generated/vibe_coverage_table.tex"
read_only = true
write_policy = "generated_output"

# Generated public-repo-score TeX table. Its contract source is the JSON Schema
# in contracts/json-schema, which pins the shape of the paper/data inputs.
# Editing the table by hand is forbidden; edit the data and regenerate.
[[zone]]
path = "paper/tex/generated/public_repo_score_tables.tex"
source = "contracts/json-schema/public-repo-scores.schema.json and paper/data/public-repo-scores-20260506T014156Z.json"
command = "jankurai paper public-repo-scores --source paper/data/public-repo-scores-20260506T014156Z.json --out paper/tex/generated/public_repo_score_tables.tex"
read_only = true
write_policy = "generated_output"

# Generated conformance results TeX table.
[[zone]]
path = "paper/tex/generated/conformance_results_table.tex"
source = "conformance fixtures and expected results"
command = "jankurai conformance run --out target/jankurai/conformance-results.json --tex paper/tex/generated/conformance_results_table.tex"
read_only = true
write_policy = "generated_output"
