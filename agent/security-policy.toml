schema_version = "1.0.0"

# Every applicable scanner blocks. Dependency scanners run when their manifest
# is present; workflows and the SBOM are required even for documentation repos.
enabled_tools = ["gitleaks", "zizmor", "actionlint", "syft", "grype", "cargo-audit", "cargo-deny", "npm", "sbom-validation"]
required_tools = ["gitleaks", "zizmor", "actionlint", "syft", "grype", "sbom-validation"]
advisory_tools = []

[severity_thresholds]
fail_lane_on = "high"

